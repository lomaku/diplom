{% extends "base.html" %}
{% block title %}Восстановление пароля{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2>Забыли пароль?</h2>
    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% elif success_message %}
      <div class="alert alert-success">{{ success_message }}</div>
    {% endif %}
    <form method="post" action="/forgot-password">
      <div class="mb-3">
        <label for="email" class="form-label">Email, указанный при регистрации</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>
      <button type="submit" class="btn btn-primary">Отправить инструкцию</button>
    </form>
    <p class="mt-3"><a href="/login">Вернуться к входу</a></p>
  </div>
</div>
{% endblock %}
