<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
</head>
<body>
  <h2>У вас новый отклик!</h2>
  <p>Пользователь {{ sender_name }} оставил сообщение по вашей заявке <strong>«{{ request_title }}»</strong>.</p>
  <blockquote style="border-left:3px solid #007bff; padding-left:10px; margin:10px 0; color:#555;">
    {{ message_text }}
  </blockquote>
  <p>Войдите в систему, чтобы просмотреть все отклики.</p>
  <footer style="margin-top:20px;color:#888;">
    Это письмо отправлено автоматически, на него не нужно отвечать.
  </footer>
</body>
</html>
